# Sudoku-Extreme (MLP-T) training config — paper replication

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/sudoku-extreme-1k-aug-1000']
data_paths_test: []

evaluators: []

# Hyperparams - Training
global_batch_size: 768

epochs: 50000
eval_interval: 5000
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0

puzzle_emb_lr: 1e-4

seed: 0
min_eval_interval: 0

ema: True
ema_rate: 0.999
freeze_weights: False

# Arch overrides for MLP-T
arch:
  mlp_t: True
  pos_encodings: none
  H_cycles: 3
  L_cycles: 6